<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- `resizes-content` makes the layout (and every dvh) follow the soft
         keyboard, so the study screens can shrink instead of hiding the field
         behind the IME. The APK's WebView already resizes with adjustResize;
         this keeps the browser edition behaving the same way. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0D1120" />
    <meta name="twitter:title" content="词光 · 一词一画，点亮雅思" />
    <meta name="twitter:image" content="https://0xlei.tech/words/brand/og-card.jpg" />
    <title>词光 Word Atlas · 一词一画，点亮雅思</title>
    <meta name="description" content="7,298 个雅思核心词，每个词一幅原创插画、两句原创例句和英美发音。学会一个，就点亮一颗星。免费、开源、无需注册。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="词光 · 一词一画，点亮雅思" />
    <meta property="og:description" content="7,298 个雅思词，每个都有一幅画。学会一个，就点亮一颗星。免费、开源、无需注册。" />
    <meta property="og:image" content="https://0xlei.tech/words/brand/og-card.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-512.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preload" href="%BASE_URL%atlas/index.json" as="fetch" crossorigin="anonymous" />
    <script>
      // Paint the saved palette before the first frame: theme + night sky +
      // English face. Kept in step with src/lib/theme.ts.
      (function () {
        var d = document.documentElement;
        var s = {};
        try {
          s = JSON.parse(localStorage.getItem("word-atlas:settings") || "{}") || {};
        } catch (e) {}
        var t = s.theme || "dark";
        var skin = t === "aurora" || t === "starlight";
        var mode = t;
        if (t === "system") {
          // A WebView answers prefers-color-scheme from the app's own theme, so
          // ask the shell for the phone's real setting.
          mode = null;
          try {
            var v = window.WordAtlasAndroid && window.WordAtlasAndroid.systemTheme();
            if (v === "dark" || v === "light") mode = v;
          } catch (e) {}
          if (!mode) mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        d.setAttribute("data-theme", skin ? "dark" : mode);
        if (skin) d.setAttribute("data-skin", t);
        d.setAttribute("data-font", s.wordFont || "serif");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
